version: "3.9"

services:
  db:
    image: postgres:18
    container_name: erp_db
    restart: always
    env_file:
      - .env.prod
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
    networks:
      - erp_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: erp_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    volumes:
      - .:/app
    networks:
      - erp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - erp_network

  backup:
    image: postgres:18
    container_name: erp_backup
    restart: always
    env_file:
      - .env.prod
    volumes:
      - ./backups:/backups
      - ./backup.sh:/docker-entrypoint-initdb.d/backup.sh
    networks:
      - erp_network
    entrypoint: ["bash", "/docker-entrypoint-initdb.d/backup.sh"]

networks:
  erp_network:
    driver: bridge
