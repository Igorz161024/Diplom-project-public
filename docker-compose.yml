version: "3.9"

services:
  db:
    image: postgres:18
    container_name: erp_db
    restart: always
    env_file:
      - .env.prod
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: erp_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    networks:
      - erp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    networks:
      - erp_network

  backup:
    image: alpine
    container_name: erp_backup
    restart: always
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh
    networks:
      - erp_network
    entrypoint: ["/bin/sh", "/backup.sh"]

networks:
  erp_network:
    driver: bridge

volumes:
  db_data:
